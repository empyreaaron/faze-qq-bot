name: Test monitor
on:
  pull_request:
  push:
    paths: ["src/**", "test/**", "package*.json", ".github/workflows/test.yml"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm test
