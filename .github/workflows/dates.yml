name: Read match dates
on:
  push:
    branches: [fix/hltv-access]
    paths: [.github/workflows/dates.yml]
jobs:
  dates:
    runs-on: ubuntu-latest
    services:
      flaresolverr:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports: ["8191:8191"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: |
          for i in $(seq 1 45); do curl -sf -m 5 http://localhost:8191/ >/dev/null && break; sleep 2; done
          node -e '
          const { HltvDataSource } = require("./src/hltv");
          (async () => { const ds = new HltvDataSource();
            for (const id of [2399044, 2399048, 2399052, 2399055]) {
              const m = await ds.getMatch(id);
              console.log("DATE", id, new Date(m.date).toISOString(), m.team1?.name, "vs", m.team2?.name, m.status);
            } })().catch(e => { console.error(e); process.exit(1); });'
        env:
          FLARESOLVERR_URL: http://localhost:8191/v1
          HLTV_DISABLE_CURLCFFI: "true"
