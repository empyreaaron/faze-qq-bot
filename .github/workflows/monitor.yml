name: Monitor FaZe matches

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只打印消息，不发送到QQ群"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: faze-match-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check HLTV and notify QQ
        env:
          QQ_APP_ID: ${{ secrets.QQ_APP_ID }}
          QQ_APP_SECRET: ${{ secrets.QQ_APP_SECRET }}
          QQ_GROUP_OPENID: ${{ secrets.QQ_GROUP_OPENID }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: npm start

      - name: Save notification state
        shell: bash
        run: |
          if git diff --quiet -- data/state.json; then
            exit 0
          fi
          git config user.name "faze-match-bot"
          git config user.email "faze-match-bot@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update notification state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
